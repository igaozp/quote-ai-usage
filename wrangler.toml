name = "quote-ai-usage"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Treat font files as binary data imports (ArrayBuffer)
[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.otf"]
fallthrough = true

# Cron trigger — uncomment to enable scheduled pushes (every 30 minutes here)
# [triggers]
# crons = ["*/30 * * * *"]

# Non-secret defaults; override via `wrangler secret put` for sensitive values
# [vars]
# DOT_API_BASE_URL = "https://dot.mindreset.tech"

# Secrets to set before deploy (do NOT commit these):
#   wrangler secret put DOT_API_KEY
#   wrangler secret put DOT_DEVICE_ID
